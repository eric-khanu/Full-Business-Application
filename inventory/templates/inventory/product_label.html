<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Label — {{ product.name }}</title>
  <style>
    @page {
      size: 50mm 40mm;
      margin: 0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Inter", -apple-system, system-ui, sans-serif;
      font-size: 9pt;
      line-height: 1.2;
      color: #000;
      background: #f1f5f9; /* only shows on screen, not print */
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .label {
      width: 50mm;
      height: 40mm;
      background: #fff;
      padding: 2mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px dashed #cbd5e1; /* preview boundary; invisible in print */
    }
    .label-header {
      font-weight: 700;
      font-size: 10pt;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .label-strength {
      font-size: 8pt;
      color: #333;
      margin-top: 1px;
    }
    .label-price {
      font-size: 15pt;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-top: 2mm;
    }
    .label-price .cur {
      font-size: 10pt;
      font-weight: 600;
      vertical-align: top;
    }
    .label-barcode {
      text-align: center;
      margin-top: auto;
    }
    .label-barcode img {
      width: 100%;
      max-height: 12mm;
      object-fit: contain;
      display: block;
    }
    .label-code {
      font-family: "Courier New", monospace;
      font-size: 6pt;
      letter-spacing: 1px;
      text-align: center;
      margin-top: 1px;
      color: #444;
    }
    /* Print controls — hidden when printing */
    .print-bar {
      position: fixed;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .print-bar button,
    .print-bar a {
      font-family: inherit;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
      text-decoration: none;
      color: #0f172a;
    }
    .print-bar button:hover,
    .print-bar a:hover {
      background: #f8fafc;
    }
    @media print {
      body {
        background: #fff;
        padding: 0;
        display: block;
      }
      .label {
        width: 50mm;
        height: 40mm;
        border: none;
      }
      .print-bar {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="print-bar">
    <a href="{% url 'inventory:product_detail' product.pk %}">← Back</a>
    <button onclick="window.print()">Print</button>
  </div>

  <div class="label">
    <div>
      <div class="label-header">{{ product.name }}</div>
      {% if product.strength %}
        <div class="label-strength">{{ product.strength }}</div>
      {% endif %}
    </div>

    <div class="label-price">
      <span class="cur">SLE</span> {{ product.selling_price|floatformat:2 }}
    </div>

    <div class="label-barcode">
      {% if barcode_image %}
        <img src="{{ barcode_image }}" alt="{{ product.barcode }}">
      {% endif %}
      <div class="label-code">{{ product.barcode }}</div>
    </div>
  </div>

  <script>
    // Auto-open print dialog when the page loads
    window.addEventListener("load", function () {
      setTimeout(function () { window.print(); }, 250);
    });
  </script>
</body>
</html>
